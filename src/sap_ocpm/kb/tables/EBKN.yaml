name: EBKN
module: MM-PUR
description: Account assignment for a purchase requisition item. Spend-dimension table, not an activity source.
key_fields:
  - {name: MANDT, description: Client, data_type: "CLNT(3)"}
  - {name: BANFN, description: Purchase requisition number, data_type: "CHAR(10)", is_key: true}
  - {name: BNFPO, description: Item number, data_type: "NUMC(5)", is_key: true}
  - {name: ZEBKN, description: Sequential account assignment number, data_type: "NUMC(2)", is_key: true}
  - {name: KOSTL, description: Cost center, data_type: "CHAR(10)"}
  - {name: SAKTO, description: GL account, data_type: "CHAR(10)"}
join_keys:
  - {field: BANFN, target_table: EBAN, target_field: BANFN, cardinality: many_to_one}
typical_role:
  - "Spend-by-cost-center dimension"
gotchas:
  - "Same fan-out risk as EKKN: multiple account assignment splits per requisition item."
timestamp_fields: []

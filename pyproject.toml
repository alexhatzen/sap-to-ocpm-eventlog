[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-ocpm"
version = "0.1.0"
description = "Constructs object-centric process-mining event logs (OCEL 2.0) from raw SAP tables, grounded in a curated table knowledge base rather than model recall."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "sqlglot>=25.0",
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "requests>=2.31",
    "mcp>=1.2",
    "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
sap-ocpm = "sap_ocpm.interfaces.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
